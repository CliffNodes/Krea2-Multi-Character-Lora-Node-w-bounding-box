[pytest]
# This ini lives in tests/ on purpose, so pytest's rootdir is tests/ and never
# the package directory above it. That directory has an __init__.py, which would
# otherwise make pytest build a Package collector for it and import that
# __init__.py standalone during setup - where its relative imports fail with
# "attempted relative import with no known parent package".
python_files = test_*.py
addopts = -q --import-mode=importlib
